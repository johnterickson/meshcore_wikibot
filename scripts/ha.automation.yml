alias: wikibot DM
description: wikibot
triggers:
  - event_type: meshcore_raw_event
    trigger: event
conditions:
  - condition: template
    value_template: |
      {{ trigger.event.data.event_type == 'EventType.CONTACT_MSG_RECV' }}
  - condition: template
    value_template: |
      {{ trigger.event.data.payload.txt_type | int(-1) == 2 }}
  - condition: template
    value_template: |
      {{ trigger.event.data.payload.signature | default('', true) | length > 0 }}
  - condition: template
    value_template: |
      {{ trigger.event.data.payload.pubkey_prefix in ['b5edac383e16', 'fa04521d1722'] }}
actions:
  - variables:
      message_text: '{{ trigger.event.data.payload.text }}'
      participant_signature: '{{ trigger.event.data.payload.signature }}'
      room_pubkey: '{{ trigger.event.data.payload.pubkey_prefix }}'
  - variables:
      conversation_agent: >-
        {{ 'conversation.ha_control' if room_pubkey == 'fa04521d1722' else
        'conversation.wikibot' }}
      meshcore_conversation_id: >-
        {{ 'meshcore_' ~ room_pubkey ~ '_' ~ participant_signature }}
      participant_mention: "{{ '@' ~ participant_signature }}"
  - if:
      - condition: template
        value_template: >-
          {{ message_text | trim | lower not in ['help', '/help'] }}
    then:
      - action: meshcore.send_message
        data:
          pubkey_prefix: '{{ room_pubkey }}'
          message: '{{ participant_mention }} [thinking]'
  - action: system_log.write
    data:
      level: warning
      message: >-
        MeshCore conversation route: room={{ room_pubkey | tojson }},
        participant={{ participant_signature | tojson }}, conversation_id={{
        meshcore_conversation_id | tojson }}, agent={{ conversation_agent |
        tojson }}
  - action: conversation.process
    continue_on_error: true
    data:
      agent_id: '{{ conversation_agent }}'
      text: '{{ message_text }}'
      conversation_id: '{{ meshcore_conversation_id }}'
    response_variable: resp
  - action: system_log.write
    data:
      level: warning
      message: |
        Wikibot response: {{ resp | tojson }}
  - choose:
      - conditions:
          - condition: template
            value_template: >
              {{ resp.response.speech.plain.speech | default('', true) | trim |
              length > 0 }}
        sequence:
          - variables:
              chunks: >
                {% set text = resp.response.speech.plain.speech %} {% set ns =
                namespace(result=[]) %} {% set prefix = participant_mention ~
                ' ' %} {% set chunk_size = 100 - prefix|length %} {% for i in
                range(0, text|length, chunk_size)
                %}
                  {% set ns.result = ns.result + [prefix ~ text[i:i+chunk_size]] %}
                {% endfor %} {{ ns.result }}
          - repeat:
              for_each: '{{ chunks }}'
              sequence:
                - action: meshcore.send_message
                  data:
                    pubkey_prefix: '{{ room_pubkey }}'
                    message: '{{ repeat.item }}'
                - delay:
                    milliseconds: 7000
    default:
      - action: meshcore.send_message
        data:
          pubkey_prefix: '{{ room_pubkey }}'
          message: >-
            {{ participant_mention }} Wikibot error: model unavailable. Try
            again in a minute.
mode: queued
trace:
  stored_traces: 200