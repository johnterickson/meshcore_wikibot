name: wikibot

services:
  kiwix:
    image: ghcr.io/kiwix/kiwix-tools:3.8.2
    restart: unless-stopped
    entrypoint: ["/usr/bin/dumb-init", "--"]
    command:
      - sh
      - -c
      - exec kiwix-serve --port=8080 --skipInvalid /data/*.zim
    ports:
      - "127.0.0.1:${KIWIX_PORT:-8081}:8080"
    volumes:
      - type: bind
        source: ${ZIM_PATH:-F:/wikipedia}
        target: /data
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/catalog/v2/entries | grep -q '<entry>'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true

  openzim-mcp:
    image: ghcr.io/cameronrye/openzim-mcp:3.3.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MCP_PORT:-8000}:8000"
    volumes:
      - type: bind
        source: ${ZIM_PATH:-F:/wikipedia}
        target: /data
        read_only: true
      - type: bind
        source: ./cache/openzim-mcp
        target: /home/appuser/.cache/openzim-mcp
    environment:
      OPENZIM_MCP_TRANSPORT: http
      OPENZIM_MCP_HOST: 0.0.0.0
      OPENZIM_MCP_AUTH_TOKEN: ${OPENZIM_MCP_AUTH_TOKEN:?Set OPENZIM_MCP_AUTH_TOKEN in .env}
      OPENZIM_MCP_LOGGING__LEVEL: ${OPENZIM_MCP_LOG_LEVEL:-INFO}
      OPENZIM_MCP_LOGGING__FORMAT: "%(asctime)s - %(name)s:%(funcName)s - %(levelname)s - %(message)s"
      OPENZIM_MCP_CACHE__MAX_SIZE: "500"
      OPENZIM_MCP_CACHE__TTL_SECONDS: "14400"
      OPENZIM_MCP_CACHE__PERSISTENCE_ENABLED: "true"
      OPENZIM_MCP_CACHE__PERSISTENCE_PATH: /home/appuser/.cache/openzim-mcp/cache.json
      OPENZIM_MCP_CACHE__LIBZIM_CLUSTER_CACHE_MAX_SIZE_BYTES: "67108864"
      OPENZIM_MCP_CACHE__LIBZIM_DIRENT_CACHE_MAX_COUNT: "2048"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/readyz').getcode() == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5m
    security_opt:
      - no-new-privileges:true

  localwiki-mcp:
    build:
      context: ./localwiki-mcp
    restart: unless-stopped
    depends_on:
      kiwix:
        condition: service_healthy
    environment:
      KIWIX_BASE_URL: http://kiwix:8080
      SEARCH_SUMMARY: "false"
      SEARCH_LIMIT: "25"
      CHAR_LIMIT: "4000"
      LOCALWIKI_MCP_AUTH_TOKEN: ${OPENZIM_MCP_AUTH_TOKEN:?Set OPENZIM_MCP_AUTH_TOKEN in .env}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  ollama:
    image: ollama/ollama:0.34.0
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      CUDA_VISIBLE_DEVICES: ${OLLAMA_GPU_DEVICE_IDS:-GPU-cdcefea5-129f-ff32-5a0f-6b627a943f26,GPU-20986d10-64a8-9a2b-43b1-251aa0f58852}
      NVIDIA_VISIBLE_DEVICES: ${OLLAMA_GPU_DEVICE_IDS:-GPU-cdcefea5-129f-ff32-5a0f-6b627a943f26,GPU-20986d10-64a8-9a2b-43b1-251aa0f58852}
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-12288}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
      OLLAMA_GPU_OVERHEAD: "0"
      LLAMA_ARG_FIT_TARGET: "128"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.3
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
      openzim-mcp:
        condition: service_healthy
    ports:
      - "${OPEN_WEBUI_PORT:-3000}:8080"
    volumes:
      - open-webui-data:/app/backend/data
    environment:
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?Set WEBUI_SECRET_KEY in .env}
      OLLAMA_BASE_URL: http://ollama:11434
      ENABLE_OLLAMA_API: "true"
      ENABLE_OPENAI_API: "false"
      ENABLE_USER_API_KEYS: "true"
      TOOL_SERVER_CONNECTIONS: >-
        [{"type":"mcp","url":"http://openzim-mcp:8000/mcp","path":"","spec_type":"url","spec":"","auth_type":"bearer","key":"${OPENZIM_MCP_AUTH_TOKEN}","config":{"enable":true,"function_name_filter_list":"","access_grants":[]},"info":{"id":"wikipedia","name":"Offline Wikipedia","description":"Search and read the local ZIM archive collection"}}]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health').getcode() == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  home-assistant-gateway:
    build:
      context: ./home-assistant-gateway
    restart: unless-stopped
    depends_on:
      localwiki-mcp:
        condition: service_healthy
    ports:
      - "${HOME_ASSISTANT_GATEWAY_PORT:-11435}:8080"
    environment:
      LM_STUDIO_BASE_URL: ws://host.docker.internal:1234
      LM_STUDIO_HTTP_URL: http://host.docker.internal:1234
      DEFAULT_MODEL: ${HOME_ASSISTANT_MODEL:-nemotron-3-nano-4b}
      LM_STUDIO_TEMPERATURE: ${LM_STUDIO_TEMPERATURE:-0.2}
      LM_STUDIO_MAX_TOKENS: ${LM_STUDIO_MAX_TOKENS:-2048}
      GATEWAY_API_KEY: ${HOME_ASSISTANT_GATEWAY_API_KEY:-${WEBUI_SECRET_KEY:?Set HOME_ASSISTANT_GATEWAY_API_KEY or WEBUI_SECRET_KEY in .env}}
      LOCALWIKI_MCP_URL: http://localwiki-mcp:8080/mcp
      LOCALWIKI_MCP_AUTH_TOKEN: ${OPENZIM_MCP_AUTH_TOKEN:?Set OPENZIM_MCP_AUTH_TOKEN in .env}
      MAX_TOOL_ROUNDS: "24"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true

volumes:
  ollama-data:
  open-webui-data: