  localwiki-mcp:
    build:
      context: ./localwiki-mcp
    restart: unless-stopped
    depends_on:
      kiwix:
        condition: service_healthy
    environment:
      KIWIX_BASE_URL: http://kiwix:8080
      SEARCH_SUMMARY: "false"
      SEARCH_LIMIT: "25"
      CHAR_LIMIT: "4000"
      LOCALWIKI_MCP_AUTH_TOKEN: ${OPENZIM_MCP_AUTH_TOKEN:?Set OPENZIM_MCP_AUTH_TOKEN in .env}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  home-assistant-gateway:
    build:
      context: ./home-assistant-gateway
    restart: unless-stopped
    depends_on:
      localwiki-mcp:
        condition: service_healthy
    ports:
      - "${HOME_ASSISTANT_GATEWAY_PORT:-11435}:8080"
      - "${HOME_ASSISTANT_CONTROL_GATEWAY_PORT:-11436}:8081"
    environment:
      CONTROL_PORT: "8081"
      LM_STUDIO_BASE_URL: ws://host.docker.internal:1234
      LM_STUDIO_HTTP_URL: http://host.docker.internal:1234
      LM_STUDIO_API_KEY: ${LM_STUDIO_API_KEY:-}
      DEFAULT_MODEL: ${HOME_ASSISTANT_MODEL:-nemotron-3-nano-4b}
      LM_STUDIO_TEMPERATURE: ${LM_STUDIO_TEMPERATURE:-0.2}
      LM_STUDIO_MAX_TOKENS: ${LM_STUDIO_MAX_TOKENS:-2048}
      GATEWAY_API_KEY: ${HOME_ASSISTANT_GATEWAY_API_KEY:?Set HOME_ASSISTANT_GATEWAY_API_KEY in .env}
      CONTROL_GATEWAY_API_KEY: ${HOME_ASSISTANT_CONTROL_GATEWAY_API_KEY:-}
      LOCALWIKI_MCP_URL: http://localwiki-mcp:8080/mcp
      LOCALWIKI_MCP_AUTH_TOKEN: ${OPENZIM_MCP_AUTH_TOKEN:?Set OPENZIM_MCP_AUTH_TOKEN in .env}
      MAX_TOOL_ROUNDS: "24"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
